<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Kelly — AI Scientist Poet</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 760px; margin: auto; }
    textarea { width: 100%; height: 120px; }
    pre { background:#f4f4f4; padding:12px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>Kelly — AI Scientist Poet</h1>
  <p>Ask Kelly anything. She answers in skeptical, analytical poems.</p>
  <textarea id="q" placeholder="Ask: Is AI dangerous?"></textarea><br/>
  <button id="go">Ask Kelly</button>
  <h3>Answer</h3>
  <pre id="ans">(Kelly awaits)</pre>

  <script>
    document.getElementById('go').onclick = async () => {
      const question = document.getElementById('q').value.trim();
      if(!question) return alert('Type something');
      document.getElementById('ans').textContent = "Thinking...";
      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({question})
        });
        if(!res.ok) throw new Error(await res.text());
        const json = await res.json();
        document.getElementById('ans').textContent = json.answer;
      } catch(err) {
        document.getElementById('ans').textContent = "Error: "+err.message;
      }
    }
  </script>
</body>
</html>
